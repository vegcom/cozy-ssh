# ~/.ssh/ssh_config.d/jump.conf

# Example of  ~/.ssh/ssh_config.d/restricted/jump.conf
# Match host="jumpbox"
#   HostName jumpbox
#   Tag jump
#
# Match tagged !jump
#   ProxyJump jumpbox

Include ssh_config.d/restricted/jump.conf

# NOTE: '%j' token added in openssh 9.6
Match final
  LocalCommand python "%d/.ssh/scripts/state_helper.py" "%n" "%h" "%C" "%L" "%j"
  Include cache/*.conf

Match tagged="jump" final
  ConnectionAttempts 9
  ConnectTimeout 15
  ForwardAgent yes
  LogLevel ERROR
  ProxyJump none
