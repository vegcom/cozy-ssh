# ~/.ssh/ssh_config.d/jump.conf

# Example of  ~/.ssh/ssh_config.d/restricted/jump.conf
# Match host="jumphost"
#   HostName jumphost
#   Tag jump

Include ssh_config.d/restricted/jump.conf

# Runs on both parse passes. Quotes keep an empty %j as an argument.
Match exec="python \"%d/.ssh/scripts/session_ctl.py\" \"%n\" \"%h\" \"%C\" \"%L\" \"%j\""

Match final
  Include cache/session_%C.conf

Match tagged="jump" final
  ConnectionAttempts 9
  ConnectTimeout 15
  ForwardAgent yes
  LogLevel ERROR
  ProxyJump none