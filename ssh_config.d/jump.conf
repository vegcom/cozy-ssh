# ~/.ssh/ssh_config.d/jump.conf

# Example of  ~/.ssh/ssh_config.d/restricted/jump.conf
# match host="jumphost"
#   Tag jump

# Match host="!jumphost,*,!*.*"
#   ProxyJump jumphost

Include ssh_config.d/restricted/jump.conf

# Parses first evaluation only. Quotes keep an empty %j as an argument.
Match canonical exec="python \"%d/.ssh/scripts/session_ctl.py\" \"%n\" \"%h\" \"%C\" \"%L\" \"%j\""

Match final
  Include cache/session_%C.conf

Match final tagged jump
  ConnectionAttempts 9
  ConnectTimeout 15
  ForwardAgent yes
  LogLevel ERROR

Match final tagged !jump
  ConnectionAttempts 3
  ConnectTimeout 5
  ForwardAgent yes
  LogLevel INFO