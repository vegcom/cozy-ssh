# ~/.ssh/ssh_config.d/jump.conf

# Example of  ~/.ssh/ssh_config.d/restricted/jump.conf
#
# Match host="jump,jump.local,jump.example.com"
#   HostName jump
#   ProxyJump None
#   ConnectionAttempts 9
#   ConnectTimeout 15
#   ForwardAgent yes

Match tagged jump
  ConnectionAttempts 9
  ConnectTimeout 15
  ForwardAgent yes
  SetEnv __PROXYJUMP_GATE__=1
  SendEnv __PROXYJUMP_GATE__
  
Include ssh_config.d/restricted/jump.conf